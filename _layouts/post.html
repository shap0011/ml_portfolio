<style>
    @import url('https://fonts.googleapis.com/css2?family=Antonio:wght@100..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');
    /* set background image*/
    body {
        background-image: url('{{ site.baseurl }}/assets/img/bg.jpg');
        min-height: 100vh;
        background-repeat: no-repeat;
        /*width: 100%*/;
        background-size: cover;
        background-position: center;
        margin: 0;
        padding: 0;
        background-attachment: fixed;
    }
    .container {
        display: grid;
        grid-template-columns: 3fr 1fr;
        grid-template-rows: auto auto auto;
        gap: 20px;
        max-width: 1100px;
        margin: auto;
    }
    a, p, h1, h2, h3, h4, h5, h6, details, label, summary {
        font-family: "Open Sans", serif; 
        font-size: 1.2rem !important; 
    }
    code {
        background-color: rgb(238, 206, 174);
    }
    li {
        list-style-type: none;
    }
    header {
        grid-column: 1 /span 2;
        grid-row: 2;
    }
    main {
        grid-column: 1;
        grid-row: 2;
       /* min-height: 300px;*/
    }
    aside {
        grid-column: 2;
        grid-row: 2;
        /*min-height: 300px;*/        
    }
    input, textarea {
        width: 50%;
    }
    button {
        background-color: rgb(238, 206, 174);
        border: none;
        color: black;
        padding: 10px 30px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 1.2rem;
        margin-top: 1rem;
        cursor: pointer; ;
    }
    input[type=email], textarea {
        width: 100%;
        padding: 12px 20px;
        margin: 8px 0;
        box-sizing: border-box;
        border: none;
        background-color: rgb(238, 206, 174);
        color: black;
      }
    footer {
        grid-column: 1 / span 2;
        grid-row: 3;
        text-align: center;
        font-size: 1.2rem;
    }

    /* Style the navigation menu */
    a.active {
       /* font-size: 1.2rem;*/
    }
    .topnav {
        overflow: hidden;
        background-color: transparent;
        position: relative;
        border-bottom: 2px solid #333;
        font-size: 1.2rem;
    }
    
    /* Hide the links inside the navigation menu (except for logo/home) */
    .topnav #myLinks {
        display: none;
    }
    
    /* Style navigation menu links */
    .topnav a {
        color: black;
        padding: 14px 16px;
        text-decoration: none;
        font-size: 1.2rem;
        display: block;
    }
    
    /* Style the hamburger menu */
    .topnav a.icon {
        background: transparent;
        color: black;
        display: block;
        position: absolute;
        right: 0;
        top: 0;
    }
    
    /* Add a grey background color on mouse-over */
    .topnav a:hover {
        background-color: rgb(238, 206, 174);
        color: black;
    }
    .intro {
        padding: 2.5rem;
    }
    .img-responsive {
        max-width: 100%;
        height: auto;
        display: block;
    }
    @media (max-width: 768px) {
        .container {
            grid-template-columns: 1fr; /* Single column layout for mobile */
            grid-template-rows: auto auto auto auto; /* Stack items vertically */
        }
        header {
            grid-column: 1;
            grid-row: 1;
        }
        main {
            grid-column: 1; /* Main spans full width */
            grid-row: 2; /* Appears first */
        }
        aside {
            grid-column: 1; /* Sidebar spans full width */
            grid-row: 3; /* Appears second */
            text-align: center;
        }
        footer {
            grid-column: 1;
            grid-row: 4;
        }
        .img-responsive {
            max-height: 50%; 
        }
        a, p, h1, h2, h3, h4, h5, h6, details, label, summary {
            font-size: 1rem !important;
        }
        .topnav, .topnav a, button, .footer {
            font-size: 1rem !important;
        }
    }
</style>
<div class="container">
    <header>
        <div class="topnav">
            <a href="{{ site.baseurl }}/index.html" class="active">Home</a>
            <!-- Navigation links (hidden by default) -->
            <div id="myLinks">
            <a href="{{ site.baseurl }}/about.html">About</a>
            <a href="{{ site.baseurl }}/contact.html">Contact</a>
            </div>
            <!-- "Hamburger menu" / "Bar icon" to toggle the navigation links -->
            <a href="javascript:void(0);" class="icon" onclick="myFunction()">
            Menu
            </a>
        </div>
    </header>
    <main>
        {{ content }}
    </main>
    <aside>
        <div>
            <h3>Resent Posts</h3>
            {% for post in site.posts %}
            <li><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></li>
            {% endfor %}
        </div>
    </aside>
    <footer>
        <p>Copyright &copy; 2024-2025 Algonquin College, BISI, Olga Durham</p>
    </footer>
</div>
<script>
    function myFunction() {
        var x = document.getElementById("myLinks");
        if (x.style.display === "block") {
          x.style.display = "none";
        } else {
          x.style.display = "block";
        }
      }
</script>

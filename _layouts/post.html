---
---
<style>
    @import url('https://fonts.googleapis.com/css2?family=Antonio:wght@100..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap');
    .container {
        max-width: 1100px;
        margin: auto;
    }
    a, p, ul li, ol li, h1, h2, h3, h4, h5, h6 {
        font-family: "Open Sans", serif; 
    }
    a, p, ul li, ol li {
        font-size: 1.2rem; 
    }
    main {
        float: left;
        width: 70%;
        min-height: 300px;
    }
    aside {
        float: right;
        width: 25%;
        min-height: 300px;        
    }
</style>
<div class="container">
    <main>
        {{ content }}
    </main>
    <aside>
        <h3>Resent Posts</h3>
        {% for post in site.posts %}
        <li><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></li>
        {% endfor %}
    </aside>
</div>
